name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Same as Dockerfile.jekyll: the lock's ffi platform entries predate the
      # x86_64-linux-gnu split on rubygems.org, so build native gems from source
      BUNDLE_FORCE_RUBY_PLATFORM: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Matches Dockerfile.jekyll — github-pages (Jekyll 3.10) needs Ruby < 3.1
          ruby-version: '3.0'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests land on the QA app's "qa" named environment, which keeps a
      # stable URL across PRs rather than the per-PR staging URL SWA defaults to.
      - name: Deploy to QA
        if: github.event_name == 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_QA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
          deployment_environment: qa

      - name: Deploy to production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
