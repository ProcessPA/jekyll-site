name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Same as Dockerfile.jekyll: the lock's ffi platform entries predate the
      # x86_64-linux-gnu split on rubygems.org, so build native gems from source
      BUNDLE_FORCE_RUBY_PLATFORM: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Matches Dockerfile.jekyll — github-pages (Jekyll 3.10) needs Ruby < 3.1
          ruby-version: '3.0'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests go to the QA app on one fixed URL. The deploy action would
      # override any environment with the PR number, so use the SWA CLI, which
      # honours --env, and target the QA app's own production environment.
      - name: Deploy to QA
        if: github.event_name == 'pull_request'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_QA }}
        run: npx --yes @azure/static-web-apps-cli@2 deploy _site --env production

      - name: Deploy to production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
