name: Process PA
description: Enjoyable Governance for Associations, Non-Profits and SMEs
timezone: Australia/Brisbane
url: https://processpa.com
baseurl: ""

# Social-proof customer count — single-sourced, referenced via {{ site.customer_count }}.
# Confirm the current figure with the site owner before shipping and update here if it has changed.
customer_count: "140+"

plugins:
    - jekyll-seo-tag
    - jekyll-sitemap
    - jekyll-redirect-from

exclude:
    - node_modules
    - vendor
    - .bundle
    - .sass-cache
    - Dockerfile.jekyll
    - docker-compose.yml
    - Gemfile.docker
    - Gemfile.docker.lock

sass:
    style: compressed

# Default Open Graph / Twitter card image for pages that don't set their own.
# Consumed by jekyll-seo-tag as page.image; individual pages can override.
defaults:
    - scope:
        path: ""
      values:
        image: /images/AppSplash_3000px.png

# --- SEO / entity metadata (used by jekyll-seo-tag and custom schema includes) ---
logo: /images/logo-sml.png
twitter:
    username: ProcessPA
    card: summary_large_image
social:
    name: Process PA
    links:
        - https://www.facebook.com/ProcessPA
        - https://www.linkedin.com/company/process-pa
        - https://twitter.com/ProcessPA
        - https://www.instagram.com/process.pa/
        - https://www.capterra.com/p/176969/Process-PA/

# Brand facts surfaced in structured data. Update rating/rating_count from the
# live Capterra listing periodically so on-page display and schema stay in sync.
company:
    founder: Matthew Rowan
    email: support@processpa.com
    area_served: Australia
    rating: "4.2"
    rating_count: "63"
    capterra: https://www.capterra.com/p/176969/Process-PA/
    splash_image: /images/AppSplash_3000px.png